[project]
name = "shady-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "osmnx>=2.0,<3",
    "networkx>=3.4,<4",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "pvlib>=0.11",
    "lxml>=5",
    "httpx>=0.27",
    "pyarrow>=25.0.1",
    "osmium>=4.3.1",
]
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.coverage.run]
branch = true
source = ["shady"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/shady"]

[tool.ruff.lint.isort]
known-first-party = ["shady", "build_demo"]
